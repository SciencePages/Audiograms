<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audiogram Exercises</title>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #111;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin: 10px 0 15px 0;
      color: #222;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0052a3;
    }
    button.sweep-btn {
      background-color: #2e7d32;
      font-weight: 600;
      padding: 10px 18px;
    }
    button.sweep-btn:hover {
      background-color: #1b5e20;
    }
    button.secondary {
      background-color: #e2e8f0;
      color: #1e293b;
      font-weight: 500;
    }
    button.secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>Interactive Audiogram Exercises</h1>

  <div id="audiogram-container"></div>

  <script>
    /* 
      ===================================================================
      AUDIOGRAM DECIBEL (dB HL) THRESHOLD PROFILES
      Update the dB values below for each frequency (250Hz - 8000Hz) 
      to match the exact threshold lines on your graphic images!
      ===================================================================
    */
    const audiogramProfiles = {
      a: { 250: 10, 500: 10, 1000: 15, 2000: 15, 4000: 20, 8000: 20 }, // Normal hearing profile
      b: { 250: 15, 500: 20, 1000: 30, 2000: 45, 4000: 60, 8000: 75 }, // High-frequency loss
      c: { 250: 50, 500: 50, 1000: 55, 2000: 50, 4000: 50, 8000: 45 }, // Flat loss profile
      d: { 250: 10, 500: 15, 1000: 20, 2000: 55, 4000: 65, 8000: 25 }, // 4kHz notch loss
      e: { 250: 40, 500: 35, 1000: 30, 2000: 20, 4000: 15, 8000: 10 }, // Reverse slope profile
      f: { 250: 20, 500: 25, 1000: 35, 2000: 50, 4000: 70, 8000: 85 },
      g: { 250: 60, 500: 65, 1000: 70, 2000: 75, 4000: 80, 8000: 85 },
      h: { 250: 15, 500: 15, 1000: 20, 2000: 30, 4000: 50, 8000: 70 },
      i: { 250: 30, 500: 35, 1000: 40, 2000: 45, 4000: 50, 8000: 55 },
      j: { 250: 10, 500: 15, 1000: 25, 2000: 40, 4000: 75, 8000: 90 }
    };

    const frequencies = [250, 500, 1000, 2000, 4000, 8000];
    const container = document.getElementById('audiogram-container');

    // Dynamically build the UI cards
    Object.keys(audiogramProfiles).forEach(letter => {
      const upper = letter.toUpperCase();
      
      const cardHtml = `
        <div class="card">
          <img src="Audiogram%20${letter}.png" alt="Audiogram ${upper}">
          <h2>Audiogram ${upper}</h2>
          
          <div class="controls">
            <button class="sweep-btn" onclick="playFullSweep('${letter}')">▶ Play Full Threshold Sweep (250Hz - 8000Hz)</button>
            
            <div class="btn-group">
              ${frequencies.map(f => `
                <button class="secondary" onclick="playCardTone('${letter}',${f})">
                  ${f} Hz (${audiogramProfiles[letter][f]} dB)
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      container.innerHTML += cardHtml;
    });

    // Web Audio API Synthesizer
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Converts dB HL (0 dB to 100 dB) to Web Audio gain volume (0.0 to 0.4 max)
    function dbToGain(db) {
      const minDb = 0;
      const maxDb = 100;
      const normalized = Math.max(0, Math.min(1, (db - minDb) / (maxDb - minDb)));
      // Exponential curve for logarithmic human hearing perception
      return Math.pow(normalized, 2) * 0.35 + 0.001;
    }

    function playToneAtDb(freq, dbHL, duration = 0.8, startTime = 0) {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      const targetGain = dbToGain(dbHL);
      const now = startTime || ctx.currentTime;
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      
      // Smooth attack and release envelope
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(targetGain, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now);
      osc.stop(now + duration);
    }

    function playCardTone(letter, freq) {
      const dbHL = audiogramProfiles[letter][freq];
      playToneAtDb(freq, dbHL);
    }

    function playFullSweep(letter) {
      const ctx = getAudioContext();
      let startTime = ctx.currentTime;
      
      frequencies.forEach(freq => {
        const dbHL = audiogramProfiles[letter][freq];
        playToneAtDb(freq, dbHL, 0.7, startTime);
        startTime += 0.85; // Gap between tones
      });
    }
  </script>

</body>
</html>
