<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audiogram Exercises</title>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #111;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin: 10px 0;
      color: #222;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0052a3;
    }
    audio {
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>Interactive Audiogram Exercises</h1>

  <!-- Card A -->
  <div class="card">
    <img src="Audiogram%20a.png" alt="Audiogram A">
    <h2>Audiogram A</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card B -->
  <div class="card">
    <img src="Audiogram%20b.png" alt="Audiogram B">
    <h2>Audiogram B</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card C -->
  <div class="card">
    <img src="Audiogram%20c.png" alt="Audiogram C">
    <h2>Audiogram C</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card D -->
  <div class="card">
    <img src="Audiogram%20d.png" alt="Audiogram D">
    <h2>Audiogram D</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card E -->
  <div class="card">
    <img src="Audiogram%20e.png" alt="Audiogram E">
    <h2>Audiogram E</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card F -->
  <div class="card">

    <h2>Audiogram F</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card G -->
  <div class="card">
    <img src="Audiogram%20g.png" alt="Audiogram G">
    <h2>Audiogram G</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card H -->
  <div class="card">
    <img src="Audiogram%20h.png" alt="Audiogram H">
    <h2>Audiogram H</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card I -->
  <div class="card">
    <img src="Audiogram%20i.png" alt="Audiogram I">
    <h2>Audiogram I</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Card J -->
  <div class="card">
    <img src="Audiogram%20j.png" alt="Audiogram J">
    <h2>Audiogram J</h2>
    <button onclick="playTestTone(1000, 1)">Play 1000Hz Tone</button>
  </div>

  <!-- Inline Web Audio Synthesizer -->
  <script>
    let audioCtx = null;

    function playTestTone(frequency = 1000, duration = 1) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      
      // Smooth start and stop fade to avoid clicking sound
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
  </script>

</body>
</html>
