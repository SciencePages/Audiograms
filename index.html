<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audiogram Exercises</title>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #111;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin: 10px 0 15px 0;
      color: #222;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .custom-input {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }
    .custom-input input {
      width: 90px;
      padding: 6px 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0052a3;
    }
    button.secondary {
      background-color: #e2e8f0;
      color: #1e293b;
      font-weight: 500;
    }
    button.secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>Interactive Audiogram Exercises</h1>

  <!-- Card Template Generator Script -->
  <div id="audiogram-container"></div>

  <script>
    // List of audiograms from A to J
    const letters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
    const container = document.getElementById('audiogram-container');

    // Build each audiogram card dynamically
    letters.forEach(letter => {
      const upper = letter.toUpperCase();
      const inputId = `freq-${letter}`;
      
      const cardHtml = `
        <div class="card">
          <img src="Audiogram%20${letter}.png" alt="Audiogram ${upper}">
          <h2>Audiogram ${upper}</h2>
          
          <div class="controls">
            <div class="custom-input">
              <label for="${inputId}">Tone Frequency:</label>
              <input type="number" id="${inputId}" value="1000" min="125" max="10000" step="125"> Hz
              <button onclick="playCustomTone('${inputId}')">Play Custom</button>
            </div>

            <div class="btn-group">
              <button class="secondary" onclick="playPreset('${inputId}', 250)">250 Hz</button>
              <button class="secondary" onclick="playPreset('${inputId}', 500)">500 Hz</button>
              <button class="secondary" onclick="playPreset('${inputId}', 1000)">1000 Hz</button>
              <button class="secondary" onclick="playPreset('${inputId}', 2000)">2000 Hz</button>
              <button class="secondary" onclick="playPreset('${inputId}', 4000)">4000 Hz</button>
              <button class="secondary" onclick="playPreset('${inputId}', 8000)">8000 Hz</button>
            </div>
          </div>
        </div>
      `;
      container.innerHTML += cardHtml;
    });

    // Web Audio Synthesizer Logic
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration = 1) {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      
      // Smooth fade envelope to avoid audio clicks
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playCustomTone(inputId) {
      const freqInput = document.getElementById(inputId);
      const freq = parseFloat(freqInput.value) || 1000;
      playTone(freq);
    }

    function playPreset(inputId, freq) {
      document.getElementById(inputId).value = freq;
      playTone(freq);
    }
  </script>

</body>
</html>
