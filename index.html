<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearing Loss Simulation Exercises</title>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #111;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin: 10px 0 15px 0;
      color: #222;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0052a3;
    }
    button.sweep-btn {
      background-color: #2e7d32;
      font-weight: 600;
      padding: 10px 18px;
    }
    button.sweep-btn:hover {
      background-color: #1b5e20;
    }
    button.secondary {
      background-color: #e2e8f0;
      color: #1e293b;
      font-weight: 500;
    }
    button.secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>Hearing Loss Simulation</h1>
  <p class="subtitle">Experience how audio is perceived based on each audiogram's threshold curve.</p>

  <div id="audiogram-container"></div>

      ===================================================================

      i: { 250: 30, 500: 35, 1000: 40, 2000: 45, 4000: 50, 8000: 55 },
      j: { 250: 10, 500: 15, 1000: 25, 2000: 40, 4000: 75, 8000: 90 }
    };

    const frequencies = [250, 500, 1000, 2000, 4000, 8000];
    const container = document.getElementById('audiogram-container');

    // Dynamically build UI cards
    Object.keys(audiogramProfiles).forEach(letter => {
      const upper = letter.toUpperCase();
      
      const cardHtml = `
        <div class="card">
          <img src="Audiogram%20${letter}.png" alt="Audiogram ${upper}">
          <h2>Audiogram ${upper}</h2>
          
          <div class="controls">
            <button class="sweep-btn" onclick="playSimulatedSweep('${letter}')">▶ Listen to Simulated Perception Sweep</button>
            
            <div class="btn-group">
              ${frequencies.map(f => `
                <button class="secondary" onclick="playSimulatedTone('${letter}',${f})">
                  ${f} Hz (${audiogramProfiles[letter][f]} dB)
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      container.innerHTML += cardHtml;
    });

      }

        audioCtx.resume();
      }
      return audioCtx;
    }
